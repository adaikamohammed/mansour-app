name: Keep Supabase Active

on:
  schedule:
    # يعمل مرتين فقط في الأسبوع (الأحد والأربعاء) في منتصف الليل - إجمالي 8 طلبات فقط في الشهر كله!
    - cron: '0 0 * * 0,3'
  workflow_dispatch: # يتيح لك تشغيله يدوياً من GitHub في أي وقت

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase & Vercel API
        run: |
          echo "Pinging Mansour App API to prevent Supabase from pausing..."
          curl -s -f "https://mansour-app.vercel.app/api/ping" || curl -s "https://uzjosnikymcydljsalxc.supabase.co/rest/v1/"
          echo "Ping completed successfully!"
